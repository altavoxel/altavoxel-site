<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="2; url=index.html" />
  <title>Altavoxel Studio - Coming Soon</title>
  <link rel="icon" type="image/svg+xml" href="images/transparent-logo.svg" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .logo {
      height: 48px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      color: #07254f;
      margin-bottom: 10px;
    }
    p {
      color: #64748b;
      font-size: 14.5px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #0d4187;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="images/transparent-logo.svg" alt="Altavoxel" class="logo" />

    <p>Our custom GPX keepsakes studio is currently being updated for the upcoming season. Redirecting to our homepage...</p>
